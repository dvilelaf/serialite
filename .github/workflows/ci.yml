name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: Host tests and scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libmbedtls-dev
      - name: Host unit tests
        env:
          CI: "1"
        run: |
          cmake -S tests/host -B build-host-tests -G Ninja -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-host-tests
          ctest --test-dir build-host-tests --output-on-failure
      - name: Script tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Generated word list is current
        run: python3 scripts/gen_wordlist.py --check
      - name: Shell scripts
        run: shellcheck tools/flash-latest-firmware.sh tools/host/setup-linux-serial-console.sh scripts/*.sh tools/esp_http_harness/run_http_harness_tests.sh

  firmware:
    name: Firmware builds
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4
      - name: Lab build (Waveshare AMOLED)
        shell: bash
        run: . "$IDF_PATH/export.sh" && idf.py build
      - name: Headless board build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          printf 'CONFIG_SERIALITE_BOARD_GENERIC_HEADLESS=y\nCONFIG_SERIALITE_UART_SHOW_PASSWORD=y\n' > /tmp/headless.defaults
          idf.py -B build-headless -D SDKCONFIG=build-headless/sdkconfig \
            -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;/tmp/headless.defaults" build
      - name: Production profile lint and build (throwaway key)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          scripts/lint_production_profile.py
          espsecure.py generate_signing_key --version 2 --scheme rsa3072 /tmp/ci-signing-key.pem
          printf 'CONFIG_SECURE_BOOT_SIGNING_KEY="/tmp/ci-signing-key.pem"\n' > /tmp/ci-key.defaults
          idf.py -B build-prod -D SDKCONFIG=build-prod/sdkconfig \
            -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.prod.defaults;/tmp/ci-key.defaults" build

  web:
    name: Web server on the linux target
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Browser dependencies
        working-directory: tools/esp_http_harness
        run: npm ci && npx playwright install --with-deps chromium
      - name: Playwright flows and security checks
        shell: bash
        run: |
          apt-get update && apt-get install -y libbsd-dev
          . "$IDF_PATH/export.sh"
          tools/esp_http_harness/run_http_harness_tests.sh
